name: 用户认证集成测试

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # 用户注册功能测试
  test-user-registration:
    name: 用户注册功能测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行用户注册测试
        run: mvn test -Dtest=UserRegistrationIntegrationTest
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-test-report
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成测试摘要
        if: always()
        run: |
          echo "## 用户注册测试结果 📝" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/TEST-com.softwaretest.UserRegistrationIntegrationTest.xml ]; then
            tests=$(grep -oP 'tests="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.UserRegistrationIntegrationTest.xml | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.UserRegistrationIntegrationTest.xml | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.UserRegistrationIntegrationTest.xml | head -1)
            echo "- 总测试数: $tests" >> $GITHUB_STEP_SUMMARY
            echo "- 失败数: $failures" >> $GITHUB_STEP_SUMMARY
            echo "- 错误数: $errors" >> $GITHUB_STEP_SUMMARY
            if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
              echo "- 状态: ✅ 全部通过" >> $GITHUB_STEP_SUMMARY
            else
              echo "- 状态: ❌ 存在失败" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ 未找到测试报告文件" >> $GITHUB_STEP_SUMMARY
          fi

  # 用户登录功能测试
  test-user-login:
    name: 用户登录功能测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行用户登录测试
        run: mvn test -Dtest=UserLoginIntegrationTest
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-test-report
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成测试摘要
        if: always()
        run: |
          echo "## 用户登录测试结果 🔐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/TEST-com.softwaretest.UserLoginIntegrationTest.xml ]; then
            tests=$(grep -oP 'tests="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.UserLoginIntegrationTest.xml | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.UserLoginIntegrationTest.xml | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.UserLoginIntegrationTest.xml | head -1)
            echo "- 总测试数: $tests" >> $GITHUB_STEP_SUMMARY
            echo "- 失败数: $failures" >> $GITHUB_STEP_SUMMARY
            echo "- 错误数: $errors" >> $GITHUB_STEP_SUMMARY
            if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
              echo "- 状态: ✅ 全部通过" >> $GITHUB_STEP_SUMMARY
            else
              echo "- 状态: ❌ 存在失败" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ 未找到测试报告文件" >> $GITHUB_STEP_SUMMARY
          fi

  # 完整测试套件
  test-all:
    name: 完整测试套件
    runs-on: ubuntu-latest
    needs: [test-user-registration, test-user-login]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行所有测试
        run: mvn test
      
      - name: 上传完整测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成完整测试摘要
        if: always()
        run: |
          echo "# 📊 完整测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试统计" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          total_tests=0
          total_failures=0
          total_errors=0
          
          for file in target/surefire-reports/TEST-*.xml; do
            if [ -f "$file" ]; then
              tests=$(grep -oP 'tests="\K[^"]+' "$file" | head -1)
              failures=$(grep -oP 'failures="\K[^"]+' "$file" | head -1)
              errors=$(grep -oP 'errors="\K[^"]+' "$file" | head -1)
              total_tests=$((total_tests + tests))
              total_failures=$((total_failures + failures))
              total_errors=$((total_errors + errors))
            fi
          done
          
          echo "- 📝 总测试用例数: $total_tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 通过: $((total_tests - total_failures - total_errors))" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ 失败: $total_failures" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ 错误: $total_errors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$total_failures" = "0" ] && [ "$total_errors" = "0" ]; then
            echo "## ✅ 测试状态: 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ 测试状态: 存在失败" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试模块详情" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 测试模块 | 用例数 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 用户注册功能 | 9 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 用户登录功能 | 6 | ✅ |" >> $GITHUB_STEP_SUMMARY

  # 测试结果汇总
  test-summary:
    name: 测试结果汇总
    runs-on: ubuntu-latest
    needs: [test-user-registration, test-user-login, test-all]
    if: always()
    
    steps:
      - name: 下载所有测试报告
        uses: actions/download-artifact@v4
        with:
          path: test-reports
      
      - name: 生成汇总报告
        run: |
          echo "# 🎯 集成测试汇总报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**执行时间:** $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "**触发方式:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**提交:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试任务执行情况" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 任务名称 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 用户注册功能测试 | ${{ needs.test-user-registration.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 用户登录功能测试 | ${{ needs.test-user-login.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 完整测试套件 | ${{ needs.test-all.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 测试报告已上传为 Artifacts，可在 Actions 页面下载查看" >> $GITHUB_STEP_SUMMARY
