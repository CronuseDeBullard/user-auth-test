name: 新集成测试

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # 用户认证集成测试
  test-user-authentication:
    name: 用户认证集成测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行用户认证集成测试
        run: mvn test -Dtest=UserAuthenticationIntegrationTest
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-auth-test-report
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成测试摘要
        if: always()
        run: |
          echo "## 用户认证集成测试结果 🔐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/TEST-com.softwaretest.integration.UserAuthenticationIntegrationTest.xml ]; then
            tests=$(grep -oP 'tests="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.UserAuthenticationIntegrationTest.xml | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.UserAuthenticationIntegrationTest.xml | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.UserAuthenticationIntegrationTest.xml | head -1)
            skipped=$(grep -oP 'skipped="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.UserAuthenticationIntegrationTest.xml | head -1)
            echo "- 📝 总测试数: $tests" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 通过: $((tests - failures - errors - skipped))" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ 失败: $failures" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ 错误: $errors" >> $GITHUB_STEP_SUMMARY
            echo "- ⏭️ 跳过: $skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
              echo "### ✅ 状态: 全部通过" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ 状态: 存在失败" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ 未找到测试报告文件" >> $GITHUB_STEP_SUMMARY
          fi

  # 教师端考试管理集成测试
  test-teacher-exam:
    name: 教师端考试管理集成测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行教师端集成测试
        run: mvn test -Dtest=TeacherExamIntegrationTest
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-exam-test-report
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成测试摘要
        if: always()
        run: |
          echo "## 教师端考试管理集成测试结果 👨‍🏫" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/TEST-com.softwaretest.integration.TeacherExamIntegrationTest.xml ]; then
            tests=$(grep -oP 'tests="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.TeacherExamIntegrationTest.xml | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.TeacherExamIntegrationTest.xml | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.TeacherExamIntegrationTest.xml | head -1)
            skipped=$(grep -oP 'skipped="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.TeacherExamIntegrationTest.xml | head -1)
            echo "- 📝 总测试数: $tests" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 通过: $((tests - failures - errors - skipped))" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ 失败: $failures" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ 错误: $errors" >> $GITHUB_STEP_SUMMARY
            echo "- ⏭️ 跳过: $skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
              echo "### ✅ 状态: 全部通过" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ 状态: 存在失败" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ 未找到测试报告文件" >> $GITHUB_STEP_SUMMARY
          fi

  # 学生端考试集成测试
  test-student-exam:
    name: 学生端考试集成测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行学生端集成测试
        run: mvn test -Dtest=StudentExamIntegrationTest
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-exam-test-report
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成测试摘要
        if: always()
        run: |
          echo "## 学生端考试集成测试结果 👨‍🎓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/surefire-reports/TEST-com.softwaretest.integration.StudentExamIntegrationTest.xml ]; then
            tests=$(grep -oP 'tests="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.StudentExamIntegrationTest.xml | head -1)
            failures=$(grep -oP 'failures="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.StudentExamIntegrationTest.xml | head -1)
            errors=$(grep -oP 'errors="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.StudentExamIntegrationTest.xml | head -1)
            skipped=$(grep -oP 'skipped="\K[^"]+' target/surefire-reports/TEST-com.softwaretest.integration.StudentExamIntegrationTest.xml | head -1)
            echo "- 📝 总测试数: $tests" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 通过: $((tests - failures - errors - skipped))" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ 失败: $failures" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ 错误: $errors" >> $GITHUB_STEP_SUMMARY
            echo "- ⏭️ 跳过: $skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$failures" = "0" ] && [ "$errors" = "0" ]; then
              echo "### ✅ 状态: 全部通过" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ 状态: 存在失败" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ 未找到测试报告文件" >> $GITHUB_STEP_SUMMARY
          fi

  # 所有集成测试
  test-all-integration:
    name: 所有集成测试
    runs-on: ubuntu-latest
    needs: [test-user-authentication, test-teacher-exam, test-student-exam]
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: 运行所有集成测试
        run: mvn test -Dtest=*IntegrationTest
      
      - name: 上传完整测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-integration-test-reports
          path: target/surefire-reports/
          retention-days: 30
      
      - name: 生成完整测试摘要
        if: always()
        run: |
          echo "# 📊 集成测试完整报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试统计" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          total_tests=0
          total_failures=0
          total_errors=0
          total_skipped=0
          
          for file in target/surefire-reports/TEST-*.xml; do
            if [ -f "$file" ]; then
              tests=$(grep -oP 'tests="\K[^"]+' "$file" | head -1)
              failures=$(grep -oP 'failures="\K[^"]+' "$file" | head -1)
              errors=$(grep -oP 'errors="\K[^"]+' "$file" | head -1)
              skipped=$(grep -oP 'skipped="\K[^"]+' "$file" | head -1)
              total_tests=$((total_tests + tests))
              total_failures=$((total_failures + failures))
              total_errors=$((total_errors + errors))
              total_skipped=$((total_skipped + skipped))
            fi
          done
          
          echo "- 📝 总测试用例数: $total_tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 通过: $((total_tests - total_failures - total_errors - total_skipped))" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ 失败: $total_failures" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ 错误: $total_errors" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ 跳过: $total_skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$total_failures" = "0" ] && [ "$total_errors" = "0" ]; then
            echo "## ✅ 测试状态: 全部通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ 测试状态: 存在失败" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试模块详情" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 测试模块 | 预期用例数 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 用户认证集成测试 | 6 | ${{ needs.test-user-authentication.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 教师端考试管理集成测试 | 8 | ${{ needs.test-teacher-exam.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 学生端考试集成测试 | 7 | ${{ needs.test-student-exam.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**总计:** 21个集成测试用例" >> $GITHUB_STEP_SUMMARY

  # 测试结果汇总
  test-summary:
    name: 测试结果汇总
    runs-on: ubuntu-latest
    needs: [test-user-authentication, test-teacher-exam, test-student-exam, test-all-integration]
    if: always()
    
    steps:
      - name: 下载所有测试报告
        uses: actions/download-artifact@v4
        with:
          path: test-reports
      
      - name: 生成汇总报告
        run: |
          echo "# 🎯 集成测试汇总报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**执行时间:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**触发方式:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**提交:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**提交者:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 测试任务执行情况" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 任务名称 | 状态 | 结果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 用户认证集成测试 | ${{ needs.test-user-authentication.result == 'success' && '✅ 成功' || '❌ 失败' }} | 6个测试用例 |" >> $GITHUB_STEP_SUMMARY
          echo "| 教师端考试管理集成测试 | ${{ needs.test-teacher-exam.result == 'success' && '✅ 成功' || '❌ 失败' }} | 8个测试用例 |" >> $GITHUB_STEP_SUMMARY
          echo "| 学生端考试集成测试 | ${{ needs.test-student-exam.result == 'success' && '✅ 成功' || '❌ 失败' }} | 7个测试用例 |" >> $GITHUB_STEP_SUMMARY
          echo "| 所有集成测试 | ${{ needs.test-all-integration.result == 'success' && '✅ 成功' || '❌ 失败' }} | 21个测试用例 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "测试报告已上传为 Artifacts，可在 Actions 页面下载查看：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`user-auth-test-report\` - 用户认证测试报告" >> $GITHUB_STEP_SUMMARY
          echo "- \`teacher-exam-test-report\` - 教师端测试报告" >> $GITHUB_STEP_SUMMARY
          echo "- \`student-exam-test-report\` - 学生端测试报告" >> $GITHUB_STEP_SUMMARY
          echo "- \`all-integration-test-reports\` - 完整测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📚 测试文档" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 \`集成测试文档.md\` - 详细的测试说明" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 \`集成测试总结.md\` - 工作总结和最佳实践" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 \`运行集成测试.bat\` - 本地运行脚本" >> $GITHUB_STEP_SUMMARY
